name: SRMA OpenAlex repair via established runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'srma_openalex_repair/**'
      - 'srma_search/openalex_repair_trigger.txt'
      - '.github/workflows/srma-30-workstream-search.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  local-validation:
    name: Validate corrected OpenAlex queries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate runner and queries
        run: |
          python -m py_compile srma_openalex_repair/run_openalex_repair.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('srma_openalex_repair/run_openalex_repair.py')
          spec = importlib.util.spec_from_file_location('oa', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert len(mod.QUERIES) == 5
          for group, query in mod.QUERIES.items():
              assert '*' not in query
              assert len(query.encode('utf-8')) < 3500
              assert 'Bangladesh' in query
              assert 'child' in query or 'infant' in query
          print('validated:', ', '.join(mod.QUERIES))
          PY
      - name: Save validation output
        run: |
          mkdir -p validation_output
          printf 'status,queries,wildcards,per_page\npassed,5,0,100\n' > validation_output/openalex_query_validation.csv
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAlex-query-validation
          path: validation_output/
          if-no-files-found: error
          retention-days: 30

  openalex-search:
    name: Execute corrected OpenAlex API searches
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_MAILTO: st19009@mbstu.ac.bd
      OPENALEX_OUT: openalex_repair_output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Execute all five corrected searches
        run: python srma_openalex_repair/run_openalex_repair.py
      - name: Verify all searches completed
        run: |
          python - <<'PY'
          import csv, json
          rows = list(csv.DictReader(open('openalex_repair_output/openalex_search_log.csv', encoding='utf-8-sig')))
          assert len(rows) == 5
          assert all(row['Status'] == 'completed' for row in rows), rows
          summary = json.load(open('openalex_repair_output/summary.json'))
          assert summary['queries_completed'] == 5
          assert summary['queries_failed'] == 0
          assert summary['formal_screening_decisions'] == 0
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SRMA-OpenAlex-Repair-Package
          path: openalex_repair_output/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish completed results branch
        if: success()
        run: |
          cp -R openalex_repair_output /tmp/openalex_repair_output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan openalex-results-tmp
          git rm -rf .
          mkdir -p openalex_repair_output
          cp -R /tmp/openalex_repair_output/. openalex_repair_output/
          printf 'source_commit,%s\nrun_id,%s\nrun_attempt,%s\ncompleted_utc,%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > openalex_repair_output/workflow_provenance.csv
          git add openalex_repair_output
          git commit -m 'Publish completed OpenAlex repair search results'
          git branch -M openalex-results
          git push --force origin openalex-results
