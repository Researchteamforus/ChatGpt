name: SRMA OpenAlex five-group parallel repair

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'srma_openalex_repair/**'
      - 'srma_search/openalex_repair_trigger.txt'
      - '.github/workflows/srma-30-workstream-search.yml'

permissions:
  contents: read

jobs:
  key-check:
    name: Check OpenAlex key availability
    runs-on: ubuntu-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - name: Record availability without revealing value
        run: |
          mkdir -p key_check
          if [ -n "$OPENALEX_API_KEY" ]; then
            printf 'secret_name,available\nOPENALEX_API_KEY,yes\n' > key_check/status.csv
          else
            printf 'secret_name,available\nOPENALEX_API_KEY,no\n' > key_check/status.csv
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAlex-key-availability
          path: key_check/status.csv
          retention-days: 7

  local-validation:
    name: Validate corrected OpenAlex code and queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Validate code and query construction
        run: |
          python -m py_compile srma_openalex_repair/run_openalex_repair.py
          python -m py_compile srma_openalex_repair/run_openalex_group.py
          python -m py_compile srma_openalex_repair/consolidate_openalex_groups.py
          PYTHONPATH=srma_openalex_repair python - <<'PY'
          import run_openalex_repair as mod
          assert len(mod.QUERIES) == 5
          for group, query in mod.QUERIES.items():
              assert '*' not in query, group
              assert len(query.encode('utf-8')) < 3500, group
              assert 'Bangladesh' in query
              assert 'child' in query or 'infant' in query
          print('validated:', ', '.join(mod.QUERIES))
          PY
      - name: Save validation result
        run: |
          mkdir -p validation_output
          printf 'status,queries,wildcards,per_page\npassed,5,0,100\n' > validation_output/openalex_query_validation.csv
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAlex-query-validation
          path: validation_output/
          retention-days: 30

  search:
    name: OpenAlex ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        group: [coverage, timeliness, dropout, determinants, programme]
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_MAILTO: st19009@mbstu.ac.bd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Execute full cursor search
        id: execute
        continue-on-error: true
        env:
          GROUP: ${{ matrix.group }}
        run: PYTHONPATH=srma_openalex_repair python srma_openalex_repair/run_openalex_group.py --group "$GROUP" --out "group_output/$GROUP"
      - name: Record job outcome
        if: always()
        env:
          GROUP: ${{ matrix.group }}
          OUTCOME: ${{ steps.execute.outcome }}
        run: |
          mkdir -p "group_output/$GROUP"
          printf 'group,step_outcome\n%s,%s\n' "$GROUP" "$OUTCOME" > "group_output/$GROUP/execution_status.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAlex-${{ matrix.group }}
          path: group_output/${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 30

  consolidate:
    name: Consolidate and verify OpenAlex results
    needs: [search, local-validation, key-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Download all group artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OpenAlex-*
          path: downloaded
          merge-multiple: false
      - name: Consolidate exact-unique OpenAlex master
        id: consolidate
        continue-on-error: true
        run: PYTHONPATH=srma_openalex_repair python srma_openalex_repair/consolidate_openalex_groups.py --input downloaded --out openalex_repair_output
      - name: Save workflow provenance
        if: always()
        env:
          CONSOLIDATE_OUTCOME: ${{ steps.consolidate.outcome }}
        run: |
          mkdir -p openalex_repair_output
          printf 'source_commit,%s\nrun_id,%s\nrun_attempt,%s\nconsolidate_outcome,%s\ncompleted_utc,%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CONSOLIDATE_OUTCOME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > openalex_repair_output/workflow_provenance.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SRMA-OpenAlex-Parallel-Repair-Package
          path: openalex_repair_output/
          if-no-files-found: warn
          retention-days: 30
