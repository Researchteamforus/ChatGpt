name: SRMA Full-Text Retrieval GitHub Agents 001-020

on:
  push:
    branches:
      - srma-fulltext-100-agents-20260727
    paths:
      - 'srma_fulltext_100/**'
      - '.github/workflows/srma-fulltext-retrieval-100.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'srma_fulltext_100/**'
      - '.github/workflows/srma-fulltext-retrieval-100.yml'
  workflow_dispatch:

jobs:
  retrieve:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        agent: ['FT-AGENT-001', 'FT-AGENT-002', 'FT-AGENT-003', 'FT-AGENT-004', 'FT-AGENT-005', 'FT-AGENT-006', 'FT-AGENT-007', 'FT-AGENT-008', 'FT-AGENT-009', 'FT-AGENT-010', 'FT-AGENT-011', 'FT-AGENT-012', 'FT-AGENT-013', 'FT-AGENT-014', 'FT-AGENT-015', 'FT-AGENT-016', 'FT-AGENT-017', 'FT-AGENT-018', 'FT-AGENT-019', 'FT-AGENT-020']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Retrieve openly accessible full text
        run: |
          python srma_fulltext_100/retrieve_fulltext_lane.py \
            --manifest-dir srma_fulltext_100/manifests \
            --agent "${{ matrix.agent }}" \
            --output "retrieval/${{ matrix.agent }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.agent }}-fulltext
          path: retrieval/${{ matrix.agent }}
          if-no-files-found: warn
