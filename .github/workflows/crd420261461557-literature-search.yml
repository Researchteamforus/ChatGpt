name: CRD420261461557 Literature Search Runner

on:
  workflow_dispatch:
    inputs:
      max_per_source:
        description: Maximum records requested from each public API
        required: false
        default: "100"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/crd420261461557-literature-search.yml"
      - "scripts/extract_research_data.py"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: crd420261461557-literature-search
  cancel-in-progress: false

jobs:
  extract:
    name: Extract and deduplicate records
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run CRD420261461557 search
        env:
          MAX_PER_SOURCE: ${{ github.event.inputs.max_per_source || '100' }}
        run: |
          set -o pipefail
          mkdir -p outputs/CRD420261461557
          python scripts/extract_research_data.py \
            --max-per-source "$MAX_PER_SOURCE" \
            --output-dir outputs/CRD420261461557 \
            2>&1 | tee outputs/CRD420261461557/CRD420261461557_run.log

      - name: Display run metadata
        if: always()
        run: |
          if [ -f outputs/CRD420261461557/CRD420261461557_run_metadata.json ]; then
            cat outputs/CRD420261461557/CRD420261461557_run_metadata.json
          fi

      - name: Upload search outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CRD420261461557-literature-search-${{ github.run_number }}
          path: outputs/CRD420261461557/
          if-no-files-found: warn
          retention-days: 90
